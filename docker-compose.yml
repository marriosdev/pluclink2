version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - db
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: pluclink
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1940
    ports:
        - "5432:5432"